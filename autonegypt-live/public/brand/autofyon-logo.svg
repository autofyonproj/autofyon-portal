<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="charcoalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EF4444" stop-opacity="1"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- ========================================== -->
  <!-- 1. AERODYNAMIC CAR SILHOUETTE & SPEEDOMETER -->
  <!-- ========================================== -->
  <g id="car-and-meter" transform="translate(0, 10)">
    <!-- Car Roofline & Greenhouse (Sleek Coupe Profile) -->
    <path d="M 170 185
             C 240 162, 330 135, 460 128
             C 570 122, 650 148, 730 182
             C 700 176, 610 148, 490 144
             C 380 140, 270 165, 170 185 Z"
          fill="url(#charcoalGradient)"/>

    <!-- Car Waistline / Shoulder Crease -->
    <path d="M 285 180
             C 340 170, 390 164, 460 164
             C 540 164, 620 174, 675 186
             C 610 181, 530 174, 460 174
             C 380 174, 330 178, 285 180 Z"
          fill="url(#charcoalGradient)" opacity="0.9"/>

    <!-- Windshield A-Pillar accent -->
    <path d="M 490 180
             C 525 174, 570 174, 610 178
             C 560 176, 520 177, 490 180 Z"
          fill="url(#charcoalGradient)"/>

    <!-- Speedometer Gauge Track (Charcoal Arc Base) -->
    <path d="M 750 190
             C 775 165, 805 140, 850 130
             C 890 122, 930 140, 948 188
             L 932 188
             C 918 150, 882 136, 848 143
             C 812 152, 785 174, 762 195 Z"
          fill="url(#charcoalGradient)"/>

    <!-- Speedometer Needle (High-rev performance indicator) -->
    <path d="M 770 185
             C 815 148, 875 105, 935 90
             C 930 98, 880 130, 820 175
             Z"
          fill="url(#redGradient)"/>

    <!-- Tachometer / RPM Tick Segments (Vibrant Red Arcs) -->
    <!-- Segment 1 (Low Rev) -->
    <path d="M 628 152
             C 655 130, 685 112, 720 100
             L 730 109
             C 698 120, 670 137, 644 158 Z"
          fill="url(#redGradient)"/>

    <!-- Segment 2 (Mid Rev) -->
    <path d="M 734 96
             C 765 86, 798 80, 835 80
             L 838 92
             C 804 92, 773 97, 744 106 Z"
          fill="url(#redGradient)"/>

    <!-- Segment 3 (High Rev) -->
    <path d="M 850 81
             C 885 84, 918 94, 948 112
             L 940 123
             C 912 107, 882 98, 850 93 Z"
          fill="url(#redGradient)"/>

    <!-- Segment 4 (Redline Peak Tick) -->
    <path d="M 960 120
             C 980 135, 995 155, 1005 178
             L 990 182
             C 982 163, 970 146, 952 132 Z"
          fill="url(#redGradient)"/>
  </g>

  <!-- ========================================== -->
  <!-- 2. MAIN BRAND LOGOTYPE: "AUTOFYON.com"     -->
  <!-- ========================================== -->
  <g id="wordmark" transform="translate(30, 305) skewX(-12)">
    <!-- Stylized "A" with embedded racing swooshes -->
    <g id="letter-A">
      <!-- Main A Frame (Left Leg + Peak + Right Leg) -->
      <path d="M 75 0
               L 40 0
               L -2 95
               L 38 95
               L 48 68
               L 80 68
               L 72 95
               L 110 95
               Z"
            fill="url(#charcoalGradient)"/>
      <!-- Inner negative space cutout -->
      <path d="M 54 50
               L 72 50
               L 64 24
               Z"
            fill="#FFFFFF"/>
      <!-- Lower Speed Swoosh Accent 1 (Red) -->
      <path d="M -30 95
               C 5 70, 45 52, 95 48
               C 55 58, 15 76, -10 95
               Z"
               fill="url(#redGradient)"/>
      <!-- Upper Speed Swoosh Accent 2 (Red) -->
      <path d="M -8 80
               C 25 60, 60 50, 105 46
               C 68 53, 35 66, 8 80
               Z"
               fill="url(#redGradient)"/>
    </g>

    <!-- Letter "U" -->
    <path d="M 125 0
             L 160 0
             L 160 60
             C 160 72, 168 76, 180 76
             C 192 76, 200 72, 200 60
             L 200 0
             L 235 0
             L 235 60
             C 235 85, 212 98, 180 98
             C 148 98, 125 85, 125 60
             Z"
          fill="url(#charcoalGradient)"/>

    <!-- Letter "T" -->
    <path d="M 245 0
             L 325 0
             L 325 24
             L 302 24
             L 302 95
             L 268 95
             L 268 24
             L 245 24
             Z"
          fill="url(#charcoalGradient)"/>

    <!-- Letter "O" -->
    <path d="M 390 0
             C 425 0, 448 20, 448 48
             C 448 76, 425 97, 390 97
             C 355 97, 332 76, 332 48
             C 332 20, 355 0, 390 0 Z
             M 390 24
             C 375 24, 366 34, 366 48
             C 366 62, 375 73, 390 73
             C 405 73, 414 62, 414 48
             C 414 34, 405 24, 390 24 Z"
          fill="url(#charcoalGradient)"/>

    <!-- Letter "F" -->
    <path d="M 460 0
             L 528 0
             L 528 24
             L 494 24
             L 494 40
             L 522 40
             L 522 62
             L 494 62
             L 494 95
             L 460 95
             Z"
          fill="url(#charcoalGradient)"/>

    <!-- Letter "Y" -->
    <path d="M 536 0
             L 568 0
             L 590 42
             L 612 0
             L 644 0
             L 607 58
             L 607 95
             L 573 95
             L 573 58
             Z"
          fill="url(#charcoalGradient)"/>

    <!-- ========================= -->
    <!-- RACING RED EMPHASIS: "ON" -->
    <!-- ========================= -->
    <!-- Letter "O" (Red) -->
    <path d="M 710 0
             C 748 0, 772 20, 772 48
             C 772 76, 748 97, 710 97
             C 672 97, 648 76, 648 48
             C 648 20, 672 0, 710 0 Z
             M 710 24
             C 693 24, 684 34, 684 48
             C 684 62, 693 73, 710 73
             C 727 73, 736 62, 736 48
             C 736 34, 727 24, 710 24 Z"
          fill="url(#redGradient)"/>

    <!-- Letter "N" (Red) -->
    <path d="M 785 0
             L 818 0
             L 856 56
             L 856 0
             L 890 0
             L 890 95
             L 857 95
             L 819 39
             L 819 95
             L 785 95
             Z"
          fill="url(#redGradient)"/>

    <!-- Letter ".com" -->
    <!-- Dot "." -->
    <circle cx="910" cy="85" r="7" fill="url(#charcoalGradient)"/>

    <!-- "c" -->
    <path d="M 952 42
             C 946 38, 938 36, 930 36
             C 918 36, 910 45, 910 60
             C 910 75, 918 84, 930 84
             C 938 84, 946 82, 952 78
             L 952 92
             C 945 96, 936 98, 926 98
             C 906 98, 892 82, 892 60
             C 892 38, 906 22, 926 22
             C 936 22, 945 24, 952 28 Z"
          fill="url(#charcoalGradient)"/>

    <!-- "o" -->
    <path d="M 978 22
             C 994 22, 1006 35, 1006 60
             C 1006 85, 994 98, 978 98
             C 962 98, 950 85, 950 60
             C 950 35, 962 22, 978 22 Z
             M 978 36
             C 970 36, 966 45, 966 60
             C 966 75, 970 84, 978 84
             C 986 84, 990 75, 990 60
             C 990 45, 986 36, 978 36 Z"
          fill="url(#charcoalGradient)"/>

    <!-- "m" -->
    <path d="M 1012 24
             L 1025 24
             L 1025 36
             C 1029 27, 1037 22, 1046 22
             C 1054 22, 1060 26, 1063 34
             C 1068 26, 1076 22, 1086 22
             C 1098 22, 1106 31, 1106 48
             L 1106 95
             L 1092 95
             L 1092 52
             C 1092 42, 1087 36, 1080 36
             C 1073 36, 1068 41, 1068 50
             L 1068 95
             L 1054 95
             L 1054 52
             C 1054 42, 1049 36, 1042 36
             C 1035 36, 1030 41, 1030 50
             L 1030 95
             L 1012 95 Z"
          fill="url(#charcoalGradient)"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. TAGLINE: "DRIVE • EXPLORE • CONNECT"    -->
  <!-- ========================================== -->
  <g id="tagline" transform="translate(0, 385)">
    <!-- Left Tapered Speed Streak -->
    <path d="M 35 15
             L 190 15
             C 150 18, 90 20, 35 20
             Z"
          fill="url(#redGradient)"/>

    <!-- Tagline Text -->
    <text x="500" y="22"
          text-anchor="middle"
          fill="#1E293B"
          font-family="'Inter', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="20"
          font-weight="800"
          letter-spacing="9"
          font-style="italic">
      DRIVE <tspan fill="#DC2626" font-style="normal" font-size="24"> • </tspan> EXPLORE <tspan fill="#DC2626" font-style="normal" font-size="24"> • </tspan> CONNECT
    </text>

    <!-- Right Tapered Speed Streak -->
    <path d="M 965 15
             L 810 15
             C 850 18, 910 20, 965 20
             Z"
          fill="url(#redGradient)"/>
  </g>
</svg>
